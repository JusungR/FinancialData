name: collect-kr

on:
  schedule:
    - cron: "0 9 * * 1-5"  # 18:00 KST 평일 (수급 데이터 확정 후, cron 지연 여유 포함)
  workflow_dispatch:
    inputs:
      days:
        description: "백필 대상 최근 N일"
        default: "7"

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python src/collect_kr.py --days ${{ inputs.days || '7' }}
      - name: Commit data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "data: kr $(date -u +%F)"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
